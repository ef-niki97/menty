<!doctype html>
<meta charset="utf-8">
<title>Menty — промо</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>html,body{margin:0;background:#111;height:100%}canvas{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;margin:auto}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Промо-ролик Menty (≈10 с): рисуется на canvas по времени и записывается через MediaRecorder в mp4.
// Запуск: открыть страницу, в консоли вызвать record() — файл отправится на локальный сервер.
const W = 1920, H = 1080, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const TOTAL = 13.6, SHIFT = 2.8; // SHIFT — на сколько сдвинуты сцены D и E из-за вставленного профиля
const INK = '#111113', BG = '#fbfbfd';
const G = [{ n: 10, color: '#3558f5', tint: 'rgba(53,88,245,.08)', label: 'Хард-скиллы' }, { n: 10, color: '#f2813b', tint: 'rgba(242,129,59,.09)', label: 'Софт-скиллы' }, { n: 5, color: '#b94de0', tint: 'rgba(185,77,224,.08)', label: 'AI-скиллы' }];
const N = 25, groupOf = (i) => (i < 10 ? 0 : i < 20 ? 1 : 2);
const LOGO = new Path2D('M 587.01 411.549 C 614.526 410.347 642.094 411.544 669.403 415.128 C 729.559 422.891 781.384 439.927 831.899 474.115 C 953.304 556.281 970.149 699.874 998.689 833.088 L 1063.38 1132.36 C 1067.14 1149.88 1085.04 1239.57 1091.32 1247.7 C 1096.52 1249.21 1099.4 1239.09 1100.3 1235.12 C 1108.12 1200.76 1114.94 1166.17 1122.44 1131.73 C 1138.76 1058.22 1154.69 984.623 1170.24 910.945 C 1205.62 750.976 1240.05 590.796 1273.53 430.415 C 1291.08 431.522 1318.44 430.729 1336.53 430.73 L 1454.43 430.741 L 1851.23 430.909 L 1851.19 1581.53 L 1523.01 1581.29 L 1523 734.182 L 1498.72 733.94 C 1495.01 750.435 1487.11 775.604 1482.44 792.23 L 1349.01 1297.03 C 1323.36 1391.7 1298.22 1486.51 1273.59 1581.45 L 881.688 1581.77 C 871.116 1533.29 854.588 1476.35 842.088 1427.58 L 768.942 1138.21 L 708.724 896.287 C 700.577 863.708 694.159 830.95 684.938 798.537 C 676.242 764.473 654.153 727.277 614.034 727.674 C 514.594 728.66 525.088 877.039 525.023 943.325 L 525.077 1089.4 L 524.897 1581.32 C 475.531 1582.04 424.957 1581.49 375.475 1581.51 L 196.761 1581.57 L 196.829 1095.58 L 196.832 945.344 C 196.845 859.66 196.712 796.942 214.672 712.137 C 254.55 523.848 397.136 418.466 587.01 411.549 z');

let seed = 7; const srand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3), eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const s = 1.8; x -= 1; return x * x * ((s + 1) * x + s) + 1; };
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = (i) => { const v = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return v - Math.floor(v); };

// оценки для демо: было / ментор / менти / среднее (шкала 0–5)
const prev = Array.from({ length: N }, (_, i) => 1.6 + rnd(i) * 1.5);
const mentor = prev.map((v, i) => Math.min(4.8, v + 0.7 + rnd(i + 40) * 1.1));
const self = mentor.map((v, i) => clamp(v + (rnd(i + 80) - .35) * 1.5, 1.5, 5));
const avg = mentor.map((v, i) => (v + self[i]) / 2);
const mean = (a) => a.reduce((s, x) => s + x, 0) / a.length;
const grpMean = (a, g) => mean(a.filter((_, i) => groupOf(i) === g));

function txt(s, x, y, { size = 40, weight = 600, color = INK, align = 'left', alpha = 1, ls = 0, base = 'alphabetic' } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `${weight} ${size}px Inter, system-ui, sans-serif`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.letterSpacing = `${ls}px`; ctx.fillText(s, x, y); ctx.restore();
}
function rr(x, y, w, h, r, fill, { shadow = false, stroke = null, alpha = 1 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha;
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.10)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18; }
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.shadowColor = 'transparent'; ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); } ctx.restore();
}
function heart(cx, cy, s, fill) {
  ctx.beginPath(); ctx.moveTo(cx, cy + s * 0.95);
  ctx.bezierCurveTo(cx - s * 1.9, cy - s * 0.1, cx - s * 0.9, cy - s * 1.35, cx, cy - s * 0.45);
  ctx.bezierCurveTo(cx + s * 0.9, cy - s * 1.35, cx + s * 1.9, cy - s * 0.1, cx, cy + s * 0.95); ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function star(cx, cy, R, fill) {
  ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, r = i % 2 ? R * 0.46 : R; ctx[i ? 'lineTo' : 'moveTo'](cx + r * Math.cos(a), cy + r * Math.sin(a)); } ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function logoMark(x, y, size) {
  ctx.save(); ctx.translate(x, y); const k = size / 2048; ctx.scale(k, k);
  ctx.beginPath(); ctx.roundRect(0, 0, 2048, 2003, 440); ctx.fillStyle = INK; ctx.fill(); ctx.fillStyle = '#fff'; ctx.fill(LOGO); ctx.restore();
}

// ---------- радар ----------
function radar(cx, cy, R, layers, a = 1) {
  const pt = (i, v) => { const ang = (i * Math.PI * 2) / N; return [cx + (R * v / 5) * Math.sin(ang), cy - (R * v / 5) * Math.cos(ang)]; };
  ctx.save(); ctx.globalAlpha *= a;
  let start = 0;
  G.forEach((g, gi) => { // сектора групп
    const a0 = (start - .5) * (Math.PI * 2 / N), a1 = (start + g.n - .5) * (Math.PI * 2 / N);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0 - Math.PI / 2, a1 - Math.PI / 2); ctx.closePath(); ctx.fillStyle = g.tint; ctx.fill(); start += g.n;
  });
  for (let r = 1; r <= 5; r++) { ctx.beginPath(); for (let i = 0; i < N; i++) { const [x, y] = pt(i, r); ctx[i ? 'lineTo' : 'moveTo'](x, y); } ctx.closePath(); ctx.strokeStyle = `rgba(17,17,19,${r === 5 ? .16 : .08})`; ctx.lineWidth = 2; ctx.stroke(); }
  for (let i = 0; i < N; i++) { const [x, y] = pt(i, 5); ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.strokeStyle = 'rgba(17,17,19,.07)'; ctx.lineWidth = 2; ctx.stroke(); const [lx, ly] = [cx + (R + 26) * Math.sin(i * Math.PI * 2 / N), cy - (R + 26) * Math.cos(i * Math.PI * 2 / N)]; ctx.beginPath(); ctx.arc(lx, ly, 6, 0, 7); ctx.fillStyle = G[groupOf(i)].color; ctx.fill(); }
  for (const L of layers) {
    ctx.beginPath(); L.scores.forEach((v, i) => { const [x, y] = pt(i, v * L.k); ctx[i ? 'lineTo' : 'moveTo'](x, y); }); ctx.closePath();
    if (L.dash) { ctx.setLineDash([16, 12]); ctx.fillStyle = 'rgba(17,17,19,.03)'; ctx.strokeStyle = 'rgba(17,17,19,.45)'; ctx.lineWidth = 4; } else { ctx.setLineDash([]); ctx.fillStyle = 'rgba(17,17,19,.13)'; ctx.strokeStyle = INK; ctx.lineWidth = 5; }
    ctx.lineJoin = 'round'; ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
    if (!L.dash) L.scores.forEach((v, i) => { const [x, y] = pt(i, v * L.k); ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke(); });
  }
  ctx.restore();
}

// ---------- фейерверк ----------
const parts = [], fired = new Set(); let lastT = 0;
const COLORS = [INK, '#3558f5', '#f2813b', '#b94de0', '#13803a'];
function burst(x, y, n) { for (let i = 0; i < n; i++) { const a = srand() * 6.283, v = 260 + srand() * 560; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: 0.55 + srand() * 0.5, size: 4 + srand() * 6, c: COLORS[(srand() * 5) | 0] }); } }
function fx(t, dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(.12, dt); p.vy = p.vy * Math.pow(.12, dt) + 360 * dt; p.life -= p.decay * dt; if (p.life > 0) { ctx.globalAlpha = clamp(p.life); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * clamp(p.life, .35, 1), 0, 7); ctx.fill(); } }
  ctx.globalAlpha = 1;
}


// ---------- профиль менти (обезличенный) ----------
const skel = (x, y, w, h, c = 'rgba(17,17,19,.10)') => rr(x, y, w, h, h / 2, c);
function check(x, y, s, on) { rr(x, y, s, s, 9, on ? INK : null, { stroke: on ? null : 'rgba(17,17,19,.22)' }); if (on) { ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x + s * .26, y + s * .52); ctx.lineTo(x + s * .43, y + s * .70); ctx.lineTo(x + s * .75, y + s * .32); ctx.stroke(); ctx.restore(); } }
function chip(x, y, w, label, bg, fg, size = 28) { rr(x, y, w, 52, 26, bg); txt(label, x + w / 2, y + 36, { size, weight: 700, color: fg, align: 'center' }); }
function profile(T) {
  const a = eo(seg(T, 6.6, 7.0)) * (1 - seg(T, 9.1, 9.45)); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  txt('ПРОФИЛЬ МЕНТИ', 150, 120, { size: 28, weight: 700, color: 'rgba(17,17,19,.45)', ls: 4 });
  txt('Весь путь менти', 150, 208, { size: 78, weight: 800, ls: -3 }); txt('на одной странице', 150, 292, { size: 78, weight: 800, ls: -3 });
  txt('Имя и данные скрыты', 1770, 292, { size: 32, weight: 500, color: 'rgba(17,17,19,.4)', align: 'right' });
  ctx.beginPath(); ctx.rect(0, 330, W, H - 330); ctx.clip();
  const enter = 240 * (1 - eo(seg(T, 6.6, 7.5))), drift = -520 * eio(seg(T, 7.7, 9.25));
  ctx.translate(150, 350 + enter + drift);
  rr(0, 0, 1620, 2000, 48, '#f1f1f5', { shadow: true });
  const pop = (i) => eo(seg(T, 6.9 + i * .1, 7.4 + i * .1));
  const part = (i, fn) => { const k = pop(i); ctx.save(); ctx.globalAlpha *= k; ctx.translate(0, 36 * (1 - k)); fn(); ctx.restore(); };
  const card = (x, y, w, h, title, i, body, right) => part(i, () => { rr(x, y, w, h, 36, '#fff', { shadow: true }); txt(title, x + 36, y + 70, { size: 40, weight: 700, ls: -1 }); if (right) right(x + w - 36, y); body(x + 36, y); });

  // шапка: аватар-заглушка, имя-плашка, чипы
  part(0, () => {
    ctx.save(); ctx.beginPath(); ctx.arc(130, 130, 76, 0, 7); ctx.fillStyle = '#e6e6ea'; ctx.fill(); ctx.clip();
    ctx.fillStyle = 'rgba(17,17,19,.22)'; ctx.beginPath(); ctx.arc(130, 108, 26, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(130, 206, 56, 46, 0, 0, 7); ctx.fill(); ctx.restore();
    skel(240, 62, 430, 52, 'rgba(17,17,19,.13)');
    chip(240, 138, 130, 'Middle', INK, '#fff'); chip(386, 138, 150, 'Активен', 'rgba(45,181,95,.16)', '#13803a'); chip(552, 138, 232, '3,9/5  ↑ 1,3', 'rgba(17,17,19,.07)', INK);
    skel(240, 214, 300, 26);
    rr(1090, 88, 230, 76, 38, 'rgba(17,17,19,.07)'); txt('Поделиться', 1205, 138, { size: 30, weight: 700, align: 'center' });
    rr(1340, 88, 230, 76, 38, 'rgba(17,17,19,.07)'); txt('Редактировать', 1455, 138, { size: 30, weight: 700, align: 'center' });
  });

  // левая колонка
  card(50, 290, 960, 700, 'Компетенции', 1, () => {
    radar(480, 660, 215, [{ scores: prev, k: 1, dash: true }, { scores: mentor, k: eo(seg(T, 7.1, 8.1)) }]);
    G.forEach((g, i) => { const x = 90 + i * 270; ctx.beginPath(); ctx.arc(x, 956, 8, 0, 7); ctx.fillStyle = g.color; ctx.fill(); txt(g.label, x + 18, 966, { size: 26, weight: 600, color: 'rgba(17,17,19,.6)' }); });
  }, (rx, y) => { rr(rx - 420, y + 22, 420, 66, 33, 'rgba(17,17,19,.06)'); rr(rx - 414, y + 28, 138, 54, 27, '#fff', { shadow: true }); ['Ментор', 'Менти', 'Среднее'].forEach((l, i) => txt(l, rx - 414 + 69 + i * 138, y + 65, { size: 26, weight: 700, color: i ? 'rgba(17,17,19,.45)' : INK, align: 'center' })); });
  card(50, 1030, 960, 430, 'История оценок', 4, (x, y) => { [['3,9', '↑ 1,3'], ['3,1', '↑ 0,6'], ['2,5', '']].forEach(([v, d], i) => { const yy = y + 120 + i * 100; skel(x, yy, 220, 28); txt(`${v}/5`, x + 290, yy + 26, { size: 32, weight: 700 }); if (d) chip(x + 400, yy - 14, 130, d, 'rgba(45,181,95,.16)', '#13803a', 26); skel(x + 580, yy + 2, 300, 24, 'rgba(17,17,19,.07)'); }); });
  card(50, 1500, 960, 380, 'Встречи и заметки', 6, (x, y) => { [0, 1].forEach((i) => { const yy = y + 120 + i * 120; skel(x, yy, 200, 26); skel(x, yy + 48, 800, 22, 'rgba(17,17,19,.07)'); skel(x, yy + 84, 620, 22, 'rgba(17,17,19,.07)'); }); });

  // правая колонка
  part(2, () => {
    rr(1050, 290, 520, 240, 36, INK); txt('ЦЕЛЬ', 1090, 345, { size: 22, weight: 700, color: 'rgba(255,255,255,.5)', ls: 3 });
    skel(1090, 372, 380, 44, 'rgba(255,255,255,.22)'); skel(1090, 430, 260, 26, 'rgba(255,255,255,.14)'); skel(1090, 480, 120, 26, 'rgba(255,255,255,.14)'); skel(1240, 480, 120, 26, 'rgba(255,255,255,.14)'); skel(1390, 480, 120, 26, 'rgba(255,255,255,.14)');
  });
  card(1050, 560, 520, 250, 'Портфолио', 3, (x, y) => { rr(x, y + 110, 64, 64, 20, 'rgba(17,17,19,.06)'); skel(x + 90, y + 118, 230, 28); skel(x + 90, y + 160, 160, 20, 'rgba(17,17,19,.07)'); chip(x + 320, y + 118, 128, 'Актуальное', 'rgba(45,181,95,.16)', '#13803a', 22); }, (rx, y) => { rr(rx - 168, y + 26, 168, 56, 28, 'rgba(17,17,19,.07)'); txt('+ Версия', rx - 84, y + 63, { size: 24, weight: 700, align: 'center' }); });
  card(1050, 840, 520, 210, 'CV', 5, (x, y) => { rr(x, y + 100, 64, 64, 20, 'rgba(17,17,19,.06)'); skel(x + 90, y + 108, 250, 28); skel(x + 90, y + 150, 150, 20, 'rgba(17,17,19,.07)'); rr(x + 380, y + 108, 64, 56, 28, 'rgba(17,17,19,.07)'); });
  card(1050, 1080, 520, 380, 'Задачи', 7, (x, y) => { [true, true, false].forEach((on, i) => { const yy = y + 120 + i * 80; check(x, yy, 40, on); skel(x + 66, yy + 6, 300 - i * 50, 26, on ? 'rgba(17,17,19,.07)' : 'rgba(17,17,19,.13)'); }); }, (rx, y) => txt('2/3', rx, y + 66, { size: 28, weight: 600, color: 'rgba(17,17,19,.45)', align: 'right' }));
  card(1050, 1490, 520, 330, 'Отзыв', 8, (x, y) => { for (let i = 0; i < 5; i++) star(x + 24 + i * 56, y + 138, 24, INK); txt('5/5', x + 310, y + 150, { size: 30, weight: 700 }); skel(x, y + 200, 430, 24, 'rgba(17,17,19,.1)'); skel(x, y + 240, 340, 24, 'rgba(17,17,19,.1)'); });
  ctx.restore();
}

// ---------- кадр ----------
function frame(T) {
  const t = T, dt = Math.min(.05, Math.max(0, T - lastT)); lastT = T;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

  // A. логотип 0–2.0
  { const a = 1 - seg(t, 1.65, 2.0), k = back(seg(t, 0, .6)); if (a > 0) {
    ctx.save(); ctx.globalAlpha = a; ctx.translate(0, -30 * (1 - a));
    const w = 560, x0 = (W - w) / 2 - 20;
    ctx.save(); ctx.translate(x0 + 80, 470); ctx.scale(k, k); logoMark(-80, -80, 160); ctx.restore();
    txt('Menty', x0 + 190 + 40 * (1 - eo(seg(t, .35, .85))), 515, { size: 150, weight: 800, ls: -6, alpha: eo(seg(t, .35, .8)) });
    txt('Сервис для менторов и их менти', W / 2, 640, { size: 46, weight: 500, color: 'rgba(17,17,19,.52)', align: 'center', alpha: eo(seg(t, .9, 1.4)) });
    ctx.restore(); } }

  // B+C. компетенции 1.9–6.7
  { const a = eo(seg(t, 1.9, 2.4)) * (1 - seg(t, 6.35, 6.75)); if (a > 0) {
    ctx.save(); ctx.globalAlpha = a; ctx.translate(0, 24 * (1 - a));
    // левая колонка: B
    const bA = 1 - seg(t, 4.35, 4.75), cA = seg(t, 4.7, 5.1);
    if (bA > 0) { ctx.save(); ctx.globalAlpha *= bA;
      txt('ОЦЕНКА КОМПЕТЕНЦИЙ', 150, 300, { size: 28, weight: 700, color: 'rgba(17,17,19,.45)', ls: 4 });
      txt('Видно, как', 150, 410, { size: 104, weight: 800, ls: -4 }); txt('растёт менти', 150, 520, { size: 104, weight: 800, ls: -4 });
      const prog = eo(seg(t, 2.2, 3.7)); G.forEach((g, gi) => { const y = 640 + gi * 86, v = lerp(grpMean(prev, gi), grpMean(mentor, gi), prog);
        ctx.beginPath(); ctx.arc(162, y - 10, 11, 0, 7); ctx.fillStyle = g.color; ctx.fill(); txt(g.label, 192, y, { size: 36, weight: 600, color: 'rgba(17,17,19,.6)' });
        rr(560, y - 22, 260, 12, 6, 'rgba(17,17,19,.07)'); rr(560, y - 22, 260 * v / 5, 12, 6, g.color); txt(v.toFixed(1).replace('.', ','), 860, y, { size: 38, weight: 700 }); });
      const tot = lerp(mean(prev), mean(mentor), prog); rr(150, 900, 380, 90, 45, 'rgba(17,17,19,.06)');
      txt(`${tot.toFixed(1).replace('.', ',')}/5`, 190, 962, { size: 44, weight: 700 }); rr(360, 918, 150, 54, 27, 'rgba(45,181,95,.16)'); txt(`↑ ${(tot - mean(prev)).toFixed(1).replace('.', ',')}`, 435, 958, { size: 32, weight: 700, color: '#13803a', align: 'center' });
      ctx.restore(); }
    // левая колонка: C
    if (cA > 0) { ctx.save(); ctx.globalAlpha *= cA; ctx.translate(0, 20 * (1 - cA));
      txt('ДВЕ ТОЧКИ ЗРЕНИЯ', 150, 300, { size: 28, weight: 700, color: 'rgba(17,17,19,.45)', ls: 4 });
      txt('Ментор, менти', 150, 410, { size: 104, weight: 800, ls: -4 }); txt('и среднее', 150, 520, { size: 104, weight: 800, ls: -4 });
      const labels = ['Ментор', 'Менти', 'Среднее'], idx = t < 5.55 ? 0 : t < 6.1 ? 1 : 2, pos = lerp(idx === 0 ? 0 : idx === 1 ? 1 : 2, 0, 0);
      const cur = t < 5.5 ? 0 : t < 5.5 + .35 ? eio(seg(t, 5.5, 5.85)) : t < 6.05 ? 1 : 1 + eio(seg(t, 6.05, 6.4));
      rr(150, 640, 660, 92, 46, 'rgba(17,17,19,.06)'); rr(160 + cur * 214, 650, 214, 72, 36, '#fff', { shadow: true });
      labels.forEach((l, i) => txt(l, 160 + i * 214 + 107, 698, { size: 36, weight: 700, color: Math.abs(cur - i) < .5 ? INK : 'rgba(17,17,19,.45)', align: 'center' }));
      txt('Оценивают вместе: ваша оценка, самооценка', 150, 830, { size: 34, weight: 500, color: 'rgba(17,17,19,.52)' }); txt('менти и среднее по каждому навыку', 150, 876, { size: 34, weight: 500, color: 'rgba(17,17,19,.52)' });
      ctx.restore(); }
    // радар справа
    const grow = eo(seg(t, 2.2, 3.7)), cur2 = t < 5.5 ? 0 : t < 5.85 ? eio(seg(t, 5.5, 5.85)) : t < 6.05 ? 1 : 1 + eio(seg(t, 6.05, 6.4));
    let sc; if (cur2 <= 1) sc = mentor.map((v, i) => lerp(v, self[i], cur2)); else sc = self.map((v, i) => lerp(v, avg[i], cur2 - 1));
    rr(1010, 130, 790, 820, 56, '#fff', { shadow: true });
    radar(1405, 548, 270, [{ scores: prev, k: 1, dash: true }, { scores: sc, k: t < 4.7 ? grow : 1 }]);
    ctx.restore(); } }

  profile(T);

  // D. ссылка для менти (6.6–8.5 до сдвига)
  { const t = T - SHIFT, a = eo(seg(t, 6.6, 7.0)) * (1 - seg(t, 8.15, 8.5)); if (a > 0) {
    ctx.save(); ctx.globalAlpha = a; ctx.translate(0, 30 * (1 - a));
