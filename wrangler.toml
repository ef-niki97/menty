name = "menty"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Адрес *.workers.dev оставляем включённым: при наличии routes wrangler иначе отключает его по умолчанию.
workers_dev = true

# Статика сайта лежит в public/. Запросы на /api/* сначала идут в Worker.
# Свой домен (зона menty.work уже в этом аккаунте Cloudflare): при деплое Cloudflare сам создаёт DNS-запись и сертификат.
[[routes]]
pattern = "menty.work"
custom_domain = true

[[routes]]
pattern = "www.menty.work"
custom_domain = true # отсюда всё перенаправляется на menty.work

[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
ADMIN_EMAIL = "efimtsev.spb@gmail.com"
# Регистрация новых менторов: invite — по приглашению (по умолчанию), open — свободная, closed — закрыта.
SIGNUP_MODE = "invite"

# База D1 «menty» (создана в аккаунте Cloudflare).
[[d1_databases]]
binding = "DB"
database_name = "menty"
database_id = "7faf9afe-f324-4ba6-8de1-6a304e7e3426"

# Хранилище файлов CV и договоров (бакет создан в аккаунте Cloudflare).
[[r2_buckets]]
binding = "FILES"
bucket_name = "menty-files"

# Ограничение частоты запросов (Workers Rate Limiting). Окно — 10 или 60 секунд; счётчики локальны для дата-центра.
# namespace_id должен быть уникален в аккаунте Cloudflare.
[[ratelimits]] # попытки входа (с одного IP)
name = "AUTH_LIMIT"
namespace_id = "7101"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]] # просмотр публичных ссылок и ссылок отзыва (с одного IP)
name = "PUBLIC_LIMIT"
namespace_id = "7102"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]] # промахи по токенам: признак перебора
name = "MISS_LIMIT"
namespace_id = "7103"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]] # запись по публичным ссылкам: самооценка и отзыв (на IP и на токен)
name = "WRITE_LIMIT"
namespace_id = "7104"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]] # любые запросы авторизованного ментора (на аккаунт)
name = "API_LIMIT"
namespace_id = "7105"
  [ratelimits.simple]
  limit = 600
  period = 60

[[ratelimits]] # загрузка файлов (на аккаунт)
name = "UPLOAD_LIMIT"
namespace_id = "7106"
  [ratelimits.simple]
  limit = 20
  period = 60

# Секреты (в панели, не в этом файле): ADMIN_PASSWORD, GOOGLE_CLIENT_ID/SECRET, YANDEX_CLIENT_ID/SECRET — см. README.
