name = "menty"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Статика сайта лежит в public/. Запросы на /api/* сначала идут в Worker.
[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
ADMIN_EMAIL = "efimtsev.spb@gmail.com"

# База D1 «menty» (создана в аккаунте Cloudflare).
[[d1_databases]]
binding = "DB"
database_name = "menty"
database_id = "7faf9afe-f324-4ba6-8de1-6a304e7e3426"

# Секреты ADMIN_PASSWORD и SESSION_SECRET задаются в панели (не в этом файле) — см. README.
